repos:
  - repo: local
    hooks:
      - id: ignored-files
        name: Reject staged files matching Git ignore rules
        entry: python3 scripts/check-staged-paths.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
